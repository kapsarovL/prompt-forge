name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: [self-hosted, linux]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      # The one thing that can put this repo back on a GitHub invoice is a job
      # that quietly runs somewhere else — `runs-on: ubuntu-latest` is what every
      # tutorial and every generated workflow says. Self-hosted is not a
      # preference here: this box is the intended execution target for every job.
      # Cheap enough to run before install: a grep over a couple of files.
      - name: Fail if any job would run on a GitHub-hosted runner
        run: |
          if grep -rnE '^\s*runs-on:.*(ubuntu|windows|macos)' .github/workflows/; then
            echo "::error::GitHub-hosted runner found above. CI runs on the self-hosted laptop runner so this repo is never billed for Actions minutes — use 'runs-on: [self-hosted, linux]'."
            exit 1
          fi

      # Self-hosted runner is NOT root, so `corepack enable` can't symlink into
      # /usr/bin (EACCES). Install the shims into the user-writable bin instead.
      - name: Enable corepack (user dir — rootless runner can't write /usr/bin)
        run: |
          mkdir -p ~/.local/bin
          corepack enable --install-directory ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: corepack prepare pnpm@11.2.2 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_GEMINI_API_KEY: placeholder
