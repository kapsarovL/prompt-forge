name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # corepack works out of the box on a GitHub-hosted runner; keep the
      # user-bin install so the step is runner-agnostic either way.
      - name: Enable corepack
        run: |
          mkdir -p ~/.local/bin
          corepack enable --install-directory ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: corepack prepare pnpm@11.2.2 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_GEMINI_API_KEY: placeholder
